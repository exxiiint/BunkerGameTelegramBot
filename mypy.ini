[mypy]
python_version = 3.11
ignore_missing_imports = True
pretty = True
show_error_codes = True
warn_unused_ignores = True
warn_return_any = False
no_implicit_optional = True

files = app/services, app/utils

[mypy-app.handlers.*]
ignore_errors = True

[mypy-app.db.*]
ignore_errors = True

[mypy-app.config]
ignore_errors = True

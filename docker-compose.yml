services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bunker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bunker}
      POSTGRES_DB: ${POSTGRES_DB:-bunker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bunker} -d ${POSTGRES_DB:-bunker}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://bunker:bunker@postgres:5432/bunker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app

volumes:
  pgdata:

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Run unit tests
        run: docker compose run --rm bot pytest -q tests/unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start postgres
        run: docker compose up -d postgres

      - name: Run integration tests
        run: docker compose run --rm bot pytest -q tests/integration

      - name: Shutdown
        if: always()
        run: docker compose down -v
